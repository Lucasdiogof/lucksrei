<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aprovaura — promo film v2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:720px;height:720px;overflow:hidden;background:#0B0F1A}
body{font-family:'Inter',system-ui,sans-serif;color:#F8FAFC;-webkit-font-smoothing:antialiased;font-feature-settings:'cv11'}
#stage{position:absolute;left:0;top:0;width:720px;height:720px;overflow:hidden;background:#0B0F1A}
#world{position:absolute;left:0;top:0;width:720px;height:720px;transform-origin:360px 380px}
.a{position:absolute;left:0;top:0;visibility:hidden}
.disp{font-family:'Inter Display','Inter',sans-serif}
.num{font-variant-numeric:tabular-nums}
.grad{background:linear-gradient(90deg,#C4B5FD 0%,#A855F7 45%,#22D3EE 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.glow{position:absolute;left:0;top:0;border-radius:50%}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:650;letter-spacing:.2em;text-transform:uppercase;color:#A5B4C8;white-space:nowrap}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,#A855F7,#22D3EE);box-shadow:0 0 10px rgba(168,85,247,.9)}
.headline{font-size:33px;font-weight:720;letter-spacing:-.03em;line-height:1.1;white-space:nowrap}
.headline .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:5px}
.headline .w>span{display:inline-block}
.card{background:linear-gradient(180deg,#141D2E 0%,#111827 100%);border:1px solid #26324A;border-radius:24px;box-shadow:0 40px 70px -30px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.02) inset}
.chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 13px;border-radius:15px;font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.dots{display:inline-flex;gap:3px}
.dots b{width:7px;height:7px;border-radius:50%;background:#3B4A61}
.dots b.on{background:#E2E8F0}
.opt{position:absolute;left:28px;width:568px;height:56px;border-radius:15px;border:1.5px solid #2A3650;background:#172135;display:flex;align-items:center;gap:15px;padding:0 14px}
.ob{width:32px;height:32px;border-radius:50%;border:1.5px solid #41516B;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#CBD5E1;flex:none}
.ot{font-size:20px;font-weight:550;color:#EEF2F7;white-space:nowrap}
.ov{position:absolute;left:-1.5px;top:-1.5px;right:-1.5px;bottom:-1.5px;border-radius:15px;opacity:0}
.ovG{border:2px solid #22C55E;background:rgba(34,197,94,.13);box-shadow:0 0 22px rgba(34,197,94,.25)}
.ovG2{border:2px solid #22C55E;background:rgba(34,197,94,.06)}
.ovR{border:2px solid #EF4444;background:rgba(239,68,68,.13)}
.obb{position:absolute;left:14px;top:50%;margin-top:-16px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0}
.obG{background:#22C55E;box-shadow:0 0 18px rgba(34,197,94,.6)}
.obR{background:#EF4444}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;height:54px;border-radius:27px;background:#7C3AED;color:#fff;font-size:17px;font-weight:680;white-space:nowrap;box-shadow:0 14px 34px -12px rgba(124,58,237,.9),inset 0 1px 0 rgba(255,255,255,.2)}
.pilltile{width:248px;height:56px;border-radius:17px;background:rgba(22,31,48,.94);border:1px solid #2A3650;display:flex;align-items:center;gap:12px;padding:0 12px;box-shadow:0 16px 30px -18px rgba(0,0,0,.9)}
.pilltile .ico{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.pilltile span{font-size:18px;font-weight:650;color:#F1F5F9;white-space:nowrap}
.mini{width:104px;height:136px;border-radius:14px;background:#1B2639;border:1px solid #2E3D57;overflow:hidden;box-shadow:0 8px 16px -8px rgba(0,0,0,.8)}
.mini i{display:block;height:8px}
.mini b{display:block;height:5px;border-radius:3px;background:#36465F;margin:10px 14px 0}
.mini u{display:block;margin:12px 0 0 14px}
.cursor{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.95);background:rgba(255,255,255,.16);box-shadow:0 0 0 1px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.45)}
.ripple{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.9)}
.row{border-radius:16px;background:rgba(22,31,48,.94);border:1px solid #2A3650;overflow:hidden}
.cell{width:40px;height:40px;border-radius:9px;border:1.5px solid transparent}
.pill{display:flex;align-items:center;gap:10px;height:44px;padding:0 8px 0 18px;border-radius:22px;background:#151E30;border:1px solid #2C3850;font-size:16px;font-weight:650;color:#E2E8F0;white-space:nowrap;box-shadow:0 12px 26px -14px rgba(0,0,0,.9)}
.badge{min-width:30px;height:30px;padding:0 10px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:750;white-space:nowrap}
.lbl{font-size:15px;color:#94A3B8;white-space:nowrap}
.tline{position:absolute;left:28px;font-size:21px;line-height:26px;color:#DCE3EE;white-space:pre}
.rule{position:absolute;left:0;top:0;height:1.5px;background:#27324A;border-radius:2px}
.sk{position:absolute;left:28px;height:10px;border-radius:5px;background:#26324A}
</style>
</head>
<body>
<div id="stage"></div>
<script>
"use strict";
// ================================================================ utils
const TAU=Math.PI*2;
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,x)=>a+(b-a)*x;
const E={
  oc:x=>1-Math.pow(1-x,3), ic:x=>x*x*x, ioc:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  oq:x=>1-Math.pow(1-x,4), iq:x=>x*x*x*x, ioq:x=>x<.5?8*x*x*x*x:1-Math.pow(-2*x+2,4)/2,
  ob:x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
  oe:x=>x>=1?1:1-Math.pow(2,-10*x), ie:x=>x<=0?0:Math.pow(2,10*x-10),
  ioe:x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2,
  lin:x=>x
};
const bump=x=>Math.sin(Math.PI*clamp(x));
function win(t,a,b,fi=.35,fo=.3,ei=E.oc,eo=E.ic){if(t<=a||t>=b)return 0;return Math.min(ei(P(t,a,a+fi)),1-eo(P(t,b-fo,b)));}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
function mix(a,b,x){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);const c=s=>Math.round(lerp(A>>s&255,B>>s&255,clamp(x)));return `rgb(${c(16)},${c(8)},${c(0)})`;}
function bez(p0,p1,p2,u){const v=1-u;return [v*v*p0[0]+2*v*u*p1[0]+u*u*p2[0],v*v*p0[1]+2*v*u*p1[1]+u*u*p2[1]];}
function bez3(p0,p1,p2,p3,u){const v=1-u;return [v*v*v*p0[0]+3*v*v*u*p1[0]+3*v*u*u*p2[0]+u*u*u*p3[0],v*v*v*p0[1]+3*v*v*u*p1[1]+3*v*u*u*p2[1]+u*u*u*p3[1]];}
function inv(f,p){let lo=0,hi=1;for(let i=0;i<28;i++){const m=(lo+hi)/2;if(f(m)<p)lo=m;else hi=m;}return (lo+hi)/2;}

const stage=document.getElementById('stage');
function el(html,parent){const d=document.createElement('div');d.innerHTML=html.trim();const e=d.firstElementChild;(parent||stage).appendChild(e);return e;}
function T(e,o){
  const op=o.o===undefined?1:o.o;
  if(op<=0.002){if(e._v!==0){e.style.visibility='hidden';e._v=0;}return;}
  if(e._v!==1){e.style.visibility='visible';e._v=1;}
  e.style.opacity=op.toFixed(4);
  const s=o.s===undefined?1:o.s,sx=o.sx===undefined?s:o.sx,sy=o.sy===undefined?s:o.sy;
  e.style.transform=(o.tl?'':'translate(-50%,-50%) ')+`translate(${(o.x||0).toFixed(2)}px,${(o.y||0).toFixed(2)}px)`+(o.p?` perspective(900px) rotateX(${o.rx.toFixed(2)}deg) rotateY(${(o.ry||0).toFixed(2)}deg)`:'')+` rotate(${(o.r||0).toFixed(3)}deg) scale(${sx.toFixed(4)},${sy.toFixed(4)})`;
  if(o.blur!==undefined)e.style.filter=o.blur>0.05?`blur(${o.blur.toFixed(2)}px)`:'none';
  if(o.z!==undefined)e.style.zIndex=String(o.z);
}
const hide=(...els)=>{for(const e of els.flat())T(e,{o:0});};
function RECT(e,cx,cy,w,h,o=1,rad,extra=''){
  if(o<=0.002){if(e._v!==0){e.style.visibility='hidden';e._v=0;}return;}
  if(e._v!==1){e.style.visibility='visible';e._v=1;}
  e.style.opacity=o.toFixed(4);
  e.style.left=(cx-w/2).toFixed(2)+'px';e.style.top=(cy-h/2).toFixed(2)+'px';
  e.style.width=w.toFixed(2)+'px';e.style.height=h.toFixed(2)+'px';
  e.style.transform=extra||'none';
  if(rad!==undefined)e.style.borderRadius=rad.toFixed(2)+'px';
}
const op=(e,v)=>{e.style.opacity=clamp(v).toFixed(4);};
const setText=(e,s)=>{if(e._t!==s){e.textContent=s;e._t=s;}};

// ================================================================ brand (real tokens)
// lib/core/theme/app_colors.dart (dark) and lib/features/subjects/domain/entities/subject.dart
const S={
  math:{n:'Mathematics',c:'#E8A23D',i:'math'}, geo:{n:'Geography',c:'#7C6FE0',i:'geo'},
  hist:{n:'History',c:'#4CAF83',i:'hist'}, port:{n:'Portuguese',c:'#E0708A',i:'port'},
  bio:{n:'Biology',c:'#2DBE91',i:'bio'}, phys:{n:'Physics',c:'#4C7CD1',i:'phys'},
  chem:{n:'Chemistry',c:'#9C6FE0',i:'chem'}
};
const SUBJ7=['math','geo','hist','port','bio','phys','chem'];
const ICON={
  math:'<rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8.5 7.5h7M8.5 12h1.6M13.9 12h1.6M8.5 16h1.6M13.9 16h1.6"/>',
  geo:'<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c3.2 3.4 3.2 13.6 0 17M12 3.5c-3.2 3.4-3.2 13.6 0 17"/>',
  hist:'<path d="M3.5 9 12 4l8.5 5M6 10.5v7M10 10.5v7M14 10.5v7M18 10.5v7M3.5 20h17"/>',
  port:'<path d="M12 6.5C10 5 7 4.6 4 5.2v13.3c3-.6 6-.2 8 1.3 2-1.5 5-1.9 8-1.3V5.2c-3-.6-6-.2-8 1.3zM12 6.5v13.3"/>',
  bio:'<path d="M5 19C5 10 10.5 5 19 5c0 8.5-5 14-14 14zM5 19l8-8"/>',
  phys:'<path d="M13.5 3 6 13.5h5.2L10.5 21 18 10.5h-5.2z"/>',
  chem:'<path d="M9 3.5h6M10 3.5v6.2L5.2 18a2 2 0 0 0 1.7 3h10.2a2 2 0 0 0 1.7-3L14 9.7V3.5M7.5 15h9"/>',
  bookmark:'<path d="M7 3.5h10a1 1 0 0 1 1 1V21l-6-4.2L6 21V4.5a1 1 0 0 1 1-1z"/>',
  lock:'<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>', x:'<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  minus:'<path d="M6 12h12"/>', plus:'<path d="M6 12h12M12 6v12"/>'
};
const ic=(n,col,sz=20,sw=2,fill='none')=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="${fill}" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;
const STAR='M12 1.2c.95 5.7 4 8.8 10.8 10.8C16 13.95 12.95 17 12 22.8 11.05 17 8 13.95 1.2 12 8 10.05 11.05 7 12 1.2z';
let gid=0;
function starSVG(sz){const id='sg'+(gid++);return `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3E8FF"/><stop offset=".5" stop-color="#A855F7"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs><path d="${STAR}" fill="url(#${id})"/></svg>`;}
const FLAME=(s=26)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M12 2.2c.6 3.7 4.9 5.8 4.9 11.1a4.9 4.9 0 0 1-9.8 0c0-2.7 1.3-4.2 2.4-5.4.3 1.8 1.2 2.9 2.3 3.3C11.3 8.6 10.9 5.4 12 2.2z" fill="#E8763D"/><path d="M12 13.2c1.3 1.4 2.3 2.4 2.3 4a2.3 2.3 0 0 1-4.6 0c0-1.5 1-2.6 2.3-4z" fill="#FDBA74"/></svg>`;

// ================================================================ background (contextual layers)
const bg=el(`<div style="position:absolute;inset:0"></div>`);
const g1=el(`<div class="glow" style="width:900px;height:900px;background:radial-gradient(circle,rgba(124,58,237,.55) 0%,rgba(124,58,237,.14) 34%,rgba(124,58,237,0) 64%)"></div>`,bg);
const g2=el(`<div class="glow" style="width:720px;height:720px;background:radial-gradient(circle,rgba(34,211,238,.42) 0%,rgba(34,211,238,0) 60%)"></div>`,bg);
const g3=el(`<div class="glow" style="width:660px;height:660px;background:radial-gradient(circle,rgba(168,85,247,.45) 0%,rgba(168,85,247,0) 60%)"></div>`,bg);
const bgDots=el(`<div style="position:absolute;left:-24px;top:-24px;width:768px;height:768px;background-image:radial-gradient(rgba(148,163,184,.16) 1px,transparent 1.4px);background-size:24px 24px;-webkit-mask-image:radial-gradient(circle at 50% 48%,#000 0%,transparent 68%);opacity:0"></div>`,bg);
const bgGrid=el(`<div style="position:absolute;left:-48px;top:-48px;width:816px;height:816px;background-image:linear-gradient(rgba(148,163,184,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.08) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 0%,transparent 66%);opacity:0"></div>`,bg);
const bgLines=el(`<div style="position:absolute;left:0;top:-60px;width:720px;height:840px;background-image:repeating-linear-gradient(180deg,transparent 0,transparent 47px,rgba(148,163,184,.08) 47px,rgba(148,163,184,.08) 48px);-webkit-mask-image:radial-gradient(ellipse at 50% 55%,#000 0%,transparent 70%);opacity:0"></div>`,bg);
const bgc=el(`<canvas width="1440" height="1440" style="position:absolute;left:0;top:0;width:720px;height:720px"></canvas>`,bg);
const bctx=bgc.getContext('2d');bctx.scale(2,2);

// ================================================================ world (camera)
const world=el(`<div id="world"></div>`);
const W=h=>el(h,world);

// ================================================================ HUD / text (screen space)
const HUD={x:650,y:52};
const hud=el(`<div class="a" style="width:46px;height:46px;z-index:20"><svg width="46" height="46" viewBox="0 0 46 46"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset=".5" stop-color="#A855F7"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs><circle cx="23" cy="23" r="19" fill="none" stroke="#1E2738" stroke-width="2.6"/><circle id="hudArc" cx="23" cy="23" r="19" fill="none" stroke="url(#hg)" stroke-width="2.6" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" transform="rotate(-90 23 23)"/></svg><div id="hudStar" style="position:absolute;left:12px;top:12px;width:22px;height:22px;line-height:0">${starSVG(22)}</div></div>`);
const hudArc=hud.querySelector('#hudArc'),hudStar=hud.querySelector('#hudStar');
hudStar.querySelector('svg').style.display='block';   // 22×22 box centred on the ring: the star pivots on its own centre
const hudLbl=el(`<div class="a" style="font-size:11.5px;font-weight:750;letter-spacing:.22em;color:#A5B4C8;z-index:20">AURA</div>`);
const EYEBROWS=[[3.55,8.75,"Today's goal"],[8.85,17.95,'Quick practice'],[18.6,21.75,'Review mistakes'],[21.85,22.62,'Favorites'],[22.7,29.95,'Mock exam'],[30.05,34.45,'Mock exam result'],[34.55,40.8,'Essay'],[40.9,42.85,'Current affairs'],[42.95,44.95,'Profile']];
const eyebrows=EYEBROWS.map(([a,b,s])=>({a,b,e:el(`<div class="a eyebrow" style="z-index:20"><i></i>${s}</div>`)}));
const HEADLINES=[[3.7,8.6,['Build','the'],['habit.']],[18.85,21.85,['Learn','from','every'],['mistake.']],[22.75,26.1,['Simulate','the'],['real','test.']],[42.9,44.85,['Track','your'],['progress.']]];
const heads=HEADLINES.map(([a,b,w1,w2])=>{const e=el(`<div class="a headline" style="z-index:20">${w1.map(w=>`<span class="w"><span>${w}</span></span>`).join(' ')} ${w2.map(w=>`<span class="w"><span class="grad">${w}</span></span>`).join(' ')}</div>`);return {a,b,e,ws:[...e.querySelectorAll('.w>span')]};});

// ================================================================ AURA: comets + energy
const comets=[];
function comet(t0,t1,path,col,o={}){comets.push({t0,t1,path,col,w:o.w??2.4,tail:o.tail??.22,e:o.e??E.ioc,amt:o.amt??0,glow:o.glow??1});}
function qpath(a,c,b){return u=>bez(a,c,b,u);}
function burst(t0,x,y,n,cols,o={}){
  const rnd=mulberry(Math.round(t0*1000)+n*31);
  const tx=o.tx??HUD.x,ty=o.ty??HUD.y,dur=o.dur??.8,sp=o.spread??22;
  for(let i=0;i<n;i++){
    const sx=x+(rnd()-.5)*2*sp,sy=y+(rnd()-.5)*2*sp,ang=rnd()*TAU,pop=50+90*rnd();
    const c=[(sx+tx)/2+Math.cos(ang)*pop,(sy+ty)/2+Math.sin(ang)*pop];
    const d=i/n*.22+rnd()*.06;
    comet(t0+d,t0+d+dur*(.85+.3*rnd()),qpath([sx,sy],c,[tx,ty]),cols[i%cols.length],{w:1.5+rnd()*1.2,tail:.28,amt:i===0?(o.amt??0):0});
  }
}
function energy(t){let e=0;for(const c of comets)if(c.amt)e+=c.amt*E.oc(P(t,c.t1,c.t1+.5));return clamp(e);}
function hudHit(t){let h=0;for(const c of comets){if(!c.amt)continue;h=Math.max(h,bump(P(t,c.t1-.05,c.t1+.45)));}return h;}

// ================================================================ OPENING / FINALE elements
const orbitSvg=W(`<svg class="a" width="720" height="720" style="left:0;top:0"><defs><linearGradient id="og" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED" stop-opacity=".15"/><stop offset=".5" stop-color="#A855F7" stop-opacity=".95"/><stop offset="1" stop-color="#22D3EE" stop-opacity=".75"/></linearGradient></defs><ellipse id="oEl" cx="360" cy="360" rx="230" ry="74" fill="none" stroke="url(#og)" stroke-width="1.5" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/></svg>`);
const oEl=orbitSvg.querySelector('#oEl');
const core=W(`<div class="a" style="width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#DDD6FE 30%,#A855F7 62%,rgba(124,58,237,0) 72%);box-shadow:0 0 34px 10px rgba(168,85,247,.55),0 0 90px 24px rgba(34,211,238,.18)"></div>`);
const pr1=W(`<div class="a" style="width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(196,181,253,.9)"></div>`);
const pr2=W(`<div class="a" style="width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(34,211,238,.8)"></div>`);
const frags=SUBJ7.map(k=>W(`<div class="a" style="width:14px;height:14px"><div style="width:12px;height:12px;margin:1px;border-radius:50%;background:${S[k].c};box-shadow:0 0 14px 3px ${hexA(S[k].c,.7)}"></div><div class="fl" style="position:absolute;left:21px;top:-2px;font-size:13px;font-weight:750;letter-spacing:.16em;color:${mix(S[k].c,'#FFFFFF',.38)};white-space:nowrap">${S[k].n.toUpperCase()}</div></div>`));

}

  });

function qAnim(q,t,t0,pick,tap,correctIdx,revealT){

function wordsIn(n){let s='',rem=n;for(const l of ETXT){if(rem<=0)break;s+=l.slice(0,Math.min(rem,l.length))+' ';rem-=l.length;}return s.trim().split(/\s+/).filter(Boolean).length;}
const TYPED_WORDS=wordsIn(ETOT);

    });
  } else hide(rules);
  if(t<34.45||t>41.3){hide(sheet,eAura,markPill);return;}
  // editor → page (detaches, light paper) → result panel → first Current Affairs card

  const cIn=E.oc(P(t,34.5,35.05));
  let cx=360,cy=lerp(SH.cy,DOC.cy,dm),w=lerp(SH.w,DOC.w,dm),h=lerp(SH.h,DOC.h,dm);
  cy=lerp(cy,368,pm);w=lerp(w,SH.w,pm);h=lerp(h,476,pm);

  const ry=-14*bump(dm)+4*Math.sin((t-37.4)*3)*P(t,37.3,37.5)*(1-pm)+10*bump(pm);
  const rx=6*bump(dm)-5*bump(pm);

  RECT(sheet,cx,cy-10*lift,w,h,cIn,lerp(22,14,lift),`perspective(1000px) rotateY(${ry.toFixed(2)}deg) rotateX(${rx.toFixed(2)}deg) scale(${(lerp(.96,1,cIn)).toFixed(4)})`);
  const paper=E.ioc(P(t,36.95,37.3))*(1-E.ioc(P(t,37.95,38.25)));

  // typing: three real lines, then the draft runs ahead (word count follows)

  let rem=typed;
  eText.forEach((e,i)=>{const sTxt=ETXT[i];const n=i<3?clamp(rem,0,sTxt.length):(t>36.1?sTxt.length:0);rem-=sTxt.length;setText(e,sTxt.slice(0,n));});
  const ff=E.ioc(P(t,36.1,36.65));

  eText.forEach(e=>{e.style.filter=ff>.05?`blur(${(1.4*bump(ff)).toFixed(2)}px)`:'none';});
  eSk.forEach((k,i)=>op(k,P(t,36.15+i*.04,36.3+i*.04)));
  if(t>35.1&&t<36.1){let idx=0,acc=0;for(let i=0;i<3;i++){if(typed<=acc+ETXT[i].length){idx=i;break;}acc+=ETXT[i].length;idx=i;}
    caret.style.left=(28+measure(ETXT[idx].slice(0,typed-acc))+2).toFixed(1)+'px';caret.style.top=((LY(idx)-SH.top-116)-31)+'px';op(caret,1);}
  else op(caret,0);

  const mp=Math.min(E.oc(P(t,37.2,37.45)),1-P(t,37.95,38.1));
  T(markPill,{x:360,y:DOC.cy+DOC.h/2+44+8*(1-mp),o:mp,z:30});
  spin2.forEach((d,i)=>{d.style.opacity=(.35+.65*bump(((t*1.8)+i*.33)%1)).toFixed(3);});
  // result: competencies one by one, the score sums them
  op(eNote,P(t,38.6,38.85));
  eScore.style.transform=`translateY(${(10*(1-E.oc(P(t,38.12,38.5)))).toFixed(1)}px)`;
  let total=0,hit=0;COMP.forEach((c,i)=>{const arr=38.5+i*.2+.72;if(t>=arr)total=CUM[i];hit=Math.max(hit,bump(P(t,arr,arr+.25)));});
  setText(esN,String(total));esN.style.display='inline-block';esN.style.transform=`scale(${(1+.08*hit).toFixed(3)})`;esN.style.transformOrigin='0 80%';
  comp.forEach((c,i)=>{
    const a=38.5+i*.2;op(c,P(t,a,a+.2));c.style.transform=`translateX(${(-14*(1-E.oc(P(t,a,a+.3)))).toFixed(1)}px)`;
    c.querySelector('.cv').textContent=String(Math.round(COMP[i][2]*E.oc(P(t,a+.15,a+.55))));
    op(compTrack[i],P(t,a,a+.2));
    compFill[i].style.width=(568*COMP[i][2]/200*E.oc(P(t,a+.15,a+.55))).toFixed(1)+'px';
  });
  const au=E.ob(P(t,40.1,40.32));
  T(eAura,{x:540,y:214,s:lerp(.6,1,au)*(1+.08*bump(P(t,40.25,40.6))),o:Math.min(P(t,40.1,40.22),1-P(t,40.75,40.9)),z:30});
}
(function(){for(let s=35.1;s<38;s+=.005){if(wordCount(s)>=50){enableT=s;break;}}})();

// ---------------------------------------------------------------- CURRENT AFFAIRS → PROFILE
function sAffairs(t){
  if(t<40.85||t>45.4){hide(arows.map(a=>a.e),level,sample);return;}
  arows.forEach((a,i)=>{
    let x=360,y=AR_Y[i],w=624,h=140,o;
    if(i===0)o=t<41.23?0:1;
    else {const st=41.1+i*.32,u=E.oc(P(t,st,st+.5));y=AR_Y[i]+90*(1-u);o=P(t,st,st+.22);}
    const drift=0;
    // rows compress into the profile tiles
    const m=E.ioe(P(t,42.78+i*.05,43.3+i*.05));
    const [tx,ty,tw,th]=TILE[i];
    x=lerp(x+drift,tx,m);y=lerp(y,ty,m);w=lerp(w,tw,m);h=lerp(h,th,m);
    const out=E.ic(P(t,44.65+i*.05,45.05+i*.05));
    RECT(a.e,x,y,w*(1-.1*out),h*(1-.1*out),o*(1-out),lerp(22,20,m));
    op(a.dc,(i===0?P(t,41.15,41.35):P(t,41.22+i*.32,41.45+i*.32))*(1-P(t,42.75,42.9)));
    a.dc.style.transform=`translateX(${(drift*.6).toFixed(1)}px)`;
    // stats appear by mask, never counting (stable sample values)
    const s=stats[i],sv=s.querySelector('.sv'),arr=TOK_ARR[i];
    op(s,P(t,43.12,43.3)*(1-P(t,44.6,44.8)));
    sv.style.transform=`translateY(${(52*(1-E.oc(P(t,arr,arr+.35)))).toFixed(1)}px)`;
    a.e.style.boxShadow=`0 40px 70px -30px rgba(0,0,0,.85), 0 0 ${(26*bump(P(t,arr,arr+.5))).toFixed(1)}px ${hexA(TOK_COL[i],.55*bump(P(t,arr,arr+.5)))}`;
  });
  const lIn=E.oc(P(t,43.6,44.0)),lOut=E.ic(P(t,44.75,45.15));
  T(level,{x:360,y:452+30*(1-lIn),s:1-.08*lOut,o:Math.min(P(t,43.6,43.75),1-lOut)});
  lvF.style.width=(572*.4*E.oc(P(t,44.18,44.5))).toFixed(1)+'px';
  level.style.boxShadow=`0 40px 70px -30px rgba(0,0,0,.85), 0 0 ${(30*bump(P(t,44.18,44.8))).toFixed(1)}px rgba(168,85,247,${(.45*bump(P(t,44.18,44.8))).toFixed(2)})`;
  T(sample,{x:360,y:570,o:P(t,43.8,44.0)*(1-P(t,44.6,44.8))});
  tokens.forEach((k,i)=>{const arr=TOK_ARR[i],u=E.ioc(P(t,arr-.5,arr));if(t<arr-.5||t>arr+.08){T(k,{o:0});return;}const [x,y]=TOK_PATH[i](u);T(k,{x,y,s:lerp(1,.55,u),o:Math.min(P(t,arr-.5,arr-.42),1-P(t,arr-.04,arr+.06)),z:30});});
}

// ---------------------------------------------------------------- cursor
function sCursor(t){
  let k=-1;for(let i=0;i<CUR.length-1;i++){if(t>=CUR[i][0]&&t<CUR[i+1][0]){k=i;break;}}
  if(k<0||(CUR[k][3]===0&&CUR[k+1][3]===0)||CUR[k+1][0]-CUR[k][0]>1.5)hide(cursor);
  else{const a=CUR[k],b=CUR[k+1],u=E.ioc(P(t,a[0],b[0]));T(cursor,{x:lerp(a[1],b[1],u),y:lerp(a[2],b[2],u),s:1-.2*tapPress(t),o:lerp(a[3],b[3],u),z:40});}
  let shown=false;
  for(const s of TAPS){const p=P(t,s,s+.45);if(p>0&&p<1){let cx=0,cy=0;for(let i=0;i<CUR.length-1;i++){if(s>=CUR[i][0]&&s<CUR[i+1][0]){const u=E.ioc(P(s,CUR[i][0],CUR[i+1][0]));cx=lerp(CUR[i][1],CUR[i+1][1],u);cy=lerp(CUR[i][2],CUR[i+1][2],u);}}
    T(ripple,{x:cx,y:cy,s:1+1.8*E.oc(p),o:.7*(1-p),z:40});shown=true;}}
  if(!shown)hide(ripple);
}

// ---------------------------------------------------------------- fx canvas: the Aura
function drawComet(pts,col,w,g=1){
  const n=pts.length;if(n<2)return;
  ctx.lineCap='round';
  for(let i=1;i<n;i++){const a=i/(n-1);ctx.globalAlpha=a*a*.85*g;ctx.strokeStyle=col;ctx.lineWidth=w*(.2+.8*a);ctx.beginPath();ctx.moveTo(pts[i-1][0],pts[i-1][1]);ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke();}
  const h=pts[n-1];
  ctx.globalAlpha=.3*g;ctx.fillStyle=col;ctx.beginPath();ctx.arc(h[0],h[1],w*3.4,0,TAU);ctx.fill();
  ctx.globalAlpha=.95*g;ctx.fillStyle='#FFFFFF';ctx.beginPath();ctx.arc(h[0],h[1],w*.7,0,TAU);ctx.fill();
}
function sampleSpan(fn,u0,u1,n=16){const pts=[];for(let i=0;i<=n;i++)pts.push(fn(lerp(u0,u1,i/n)));return pts;}
function drawFx(t){
  ctx.clearRect(0,0,720,720);
  ctx.globalCompositeOperation='lighter';
  // declarative comets
  for(const c of comets){
    if(t<c.t0)continue;const tailT=(c.t1-c.t0)*c.tail+.08;if(t>c.t1+tailT)continue;
    const uh=c.e(P(t,c.t0,c.t1)),ut=c.e(P(t-tailT,c.t0,c.t1));if(uh-ut<.002)continue;
    const fadeEnd=1-P(t,c.t1,c.t1+tailT);
    drawComet(sampleSpan(c.path,ut,uh),c.col,c.w,c.glow*(t>c.t1?fadeEnd:1));
  }
  // opening: subject trails spiral into the logo; finale mirror
  const trail=(Rf,Af,t0,t1,cx,cy)=>{if(t<t0||t>t1)return;SUBJ7.forEach((k,i)=>{const pts=[];for(let s=14;s>=0;s--){const tt=t-s*.016;const th=-Math.PI/2+i*TAU/7+Af(tt);const [x,y]=orbitPos(th,Rf(tt),cx,cy);pts.push([x+7,y+7]);}
      drawComet(pts,S[k].c,2.2,.9);});};
  trail(openR,openAng,1.45,2.42,OC[0],OC[1]);
  trail(finR,finAng,45.3,45.95,360,262);
  DT.forEach((d,k)=>{const arr=d+.42;if(t<d||t>arr+.15)return;const [sx,sy]=TILEP(DEAL[k]);const end=[DECK[0],DECK[1]-k*2];const fn=u=>bez([sx+110,sy],[(sx+end[0])/2+40,Math.min(sy,end[1])-70],end,u);const uh=E.ioc(P(t,d,arr)),ut=E.ioc(P(t-.16,d,arr));if(uh-ut>.002)drawComet(sampleSpan(fn,ut,uh,12),S[SUBJ7[DEAL[k]]].c,2.6,.9);});
  // goal: incoming chips leave Aura trails; the arc head glows
  GT.forEach((g,k)=>{const s0=g-.48;if(t<s0||t>g+.12)return;const uh=E.ioc(P(t,s0,g)),ut=E.ioc(P(t-.14,s0,g));if(uh-ut<.002)return;drawComet(sampleSpan(u=>chipPos(k,u),ut,uh,12),S[CHIPC[k]].c,2.2,.9);});
  if(t>4.2&&t<8.6){const prog=goalProg(t);if(prog>.005){const aH=-Math.PI/2+prog*TAU,cx=RC[0],cy=RC[1];const pts=[];for(let i=0;i<=16;i++){const a=aH-.38*(1-i/16)*Math.min(1,prog*6);pts.push([cx+Math.cos(a)*132,cy+Math.sin(a)*132]);}drawComet(pts,'#E9D5FF',3.4,.95*(1-P(t,8.2,8.6)));}}
  if(t>3.3&&t<4.2){const d=E.ioc(P(t,3.3,4.1)),inP=E.ioc(P(t,3.25,4.0));const cy=lerp(330,RC[1],inP),r=132*lerp(.42,1,inP);const aH=-Math.PI/2+d*TAU;const pts=[];for(let i=0;i<=18;i++){const a=aH-1.1*(1-i/18);pts.push([360+Math.cos(a)*r,cy+Math.sin(a)*r]);}drawComet(pts,'#E9D5FF',3,(1-P(t,4.0,4.2)));}
  for(let r=0;r<5;r++){const a=32.85+r*.07,u=E.ioc(P(t,a,a+.55)),ut=E.ioc(P(t-.14,a,a+.55));if(u>0&&u<1||(ut<1&&ut>0)){const fn=v=>[48+CORR[r]*62.4*v,BARY(r)+11];drawComet(sampleSpan(fn,ut,u,10),'#BBF7D0',2.4,.9);}}
  // mock exam: the Aura runs across the grid with the current question
  if(t>MQ0&&t<29.7){const f=mqF(t);const pos=v=>{const i=clamp(v,0,49),a=Math.floor(i),b=Math.min(49,a+1),fr=i-a;return [lerp(GX(a%10),GX(b%10),b%10<a%10?0:fr),lerp(GY(Math.floor(a/10)),GY(Math.floor(b/10)),b%10<a%10?fr:0)];};
    const pts=[];for(let i=0;i<=16;i++)pts.push(pos(f-2.6*(1-i/16)));drawComet(pts,'#C4B5FD',3,.9*(1-P(t,29.5,29.7)));}
  // finale: orbs of Aura born in Aurudo's palms join his orbit
  for(const o of FORBS){
    const b=P(t,o.ts,o.ts+.12),travel=P(t,o.ts+.18,o.ts+1.0);
    if(t<o.ts||t>o.ts+1.25)continue;
    const col=o.side==='R'?'#67E8F9':'#C4B5FD';
    const hp=travel<=0?[o.palm[0],o.palm[1]-5*P(t,o.ts,o.ts+.18)]:o.path(E.ioc(travel));
    const g=(travel<=0?b:1)*(1-P(t,o.ts+.85,o.ts+1.2));
    if(travel>0){const uh=E.ioc(travel),ut=E.ioc(P(t-.22,o.ts+.18,o.ts+1.0));drawComet(sampleSpan(o.path,ut,uh,14),col,2.8,g);}
    // the orb itself: soft halo + 4-point spark
    ctx.globalAlpha=.32*g;ctx.fillStyle=col;ctx.beginPath();ctx.arc(hp[0],hp[1],12*g,0,TAU);ctx.fill();
    const sp=(4.5+2*bump(b))*Math.max(g,.2);ctx.globalAlpha=g;ctx.fillStyle='#FFFFFF';ctx.beginPath();
    ctx.moveTo(hp[0],hp[1]-sp);ctx.quadraticCurveTo(hp[0],hp[1],hp[0]+sp,hp[1]);ctx.quadraticCurveTo(hp[0],hp[1],hp[0],hp[1]+sp);ctx.quadraticCurveTo(hp[0],hp[1],hp[0]-sp,hp[1]);ctx.quadraticCurveTo(hp[0],hp[1],hp[0],hp[1]-sp);ctx.fill();
  }
  // Aurudo's orbit charges with every orb (front arc only: the ring passes behind the helmet at the top)
  if(t>47.2){const ch=farmCharge(t);if(ch>.01){
    const o=Math.min(1,P(t,47.2,47.4))*(1-P(t,49.5,49.95));
    for(const [lw,al] of [[7,.10],[3,.32]]){ctx.globalAlpha=al*ch*o;ctx.strokeStyle='#C4B5FD';ctx.lineWidth=lw;ctx.beginPath();
      for(let i=0;i<=40;i++){const [x,y]=ringPt(.15+i/40*(Math.PI-.3));if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y);}ctx.stroke();}}}
  // essay: marking traces the lines
  const sc=P(t,37.42,38.02);if(sc>0&&sc<1){const top=DOC.cy-DOC.h/2;const path=u=>{const L=9,seg=u*L,i=Math.min(L-1,Math.floor(seg)),fr=seg-i;const y=top+95+i*24;return [i%2?lerp(486,234,fr):lerp(234,486,fr),y];};
    drawComet(sampleSpan(path,Math.max(0,sc-.1),sc,24),'#A855F7',2.8,1);}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
