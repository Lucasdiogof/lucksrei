<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>OrbiJob — filme promocional</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>

@font-face{font-family:"OJ Grotesk";src:url(assets/fonts/space-grotesk-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:"OJ Grotesk";src:url(assets/fonts/space-grotesk-latin-700-normal.woff2) format("woff2");font-weight:700}
@font-face{font-family:"OJ Inter";src:url(assets/fonts/inter-latin-500-normal.woff2) format("woff2");font-weight:500}
@font-face{font-family:"OJ Inter";src:url(assets/fonts/inter-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:"OJ Inter";src:url(assets/fonts/inter-latin-700-normal.woff2) format("woff2");font-weight:700}
@font-face{font-family:"OJ Mono";src:url(assets/fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2");font-weight:500}
:root{--violet:#A298FF;--violet-deep:#5B4CF6;--ink:#F5F7FC;--muted:#A7B0C2;--bg:#0D111B;--surface:#151B28;--line:#30394B;--success:#6BD79B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);overflow:hidden;font-family:"OJ Inter",system-ui,sans-serif;color:var(--ink)}
#stage canvas{position:absolute;left:0;top:0;width:1920px;height:1080px}
#cam{position:absolute;inset:0}
.o{position:absolute;left:50%;top:50%;transform-origin:50% 50%;display:none}
.k{font-family:"OJ Grotesk",system-ui,sans-serif;font-weight:700;color:var(--ink);line-height:1.02;white-space:nowrap;text-align:center;letter-spacing:-.025em;padding:.3em 0}
.k .c{display:inline-block;padding:.3em .02em .22em;margin:-.3em -.02em -.22em}
.k .w{display:inline-block;white-space:nowrap}
.k>div+div{margin-top:.04em}
.v .c{background:linear-gradient(180deg,#D8D3FF 0%,#A298FF 55%,#7C6BFF 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.mono{font:500 22px/1 "OJ Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--violet);white-space:nowrap;text-align:center}
.mono.dim{color:var(--muted)}
.txt{font:600 36px/1.2 "OJ Inter";color:var(--ink);white-space:nowrap;text-align:center;letter-spacing:-.01em}
.txt.sm{font:500 24px/1.2 "OJ Inter";color:var(--muted)}
.chip{padding:16px 30px;border-radius:999px;border:2px solid var(--line);font:600 26px/1 "OJ Inter";color:var(--muted);background:rgba(21,27,40,.85);white-space:nowrap;text-align:center}
.chip.on{background:linear-gradient(180deg,#B9B0FF,#7C6BFF);border-color:#C9C2FF;color:#12103A;box-shadow:0 0 40px rgba(162,152,255,.45)}
.reason{display:flex;gap:16px;align-items:center;padding:18px 28px;border-radius:20px;border:2px solid var(--line);background:linear-gradient(180deg,rgba(29,37,53,.95),rgba(21,27,40,.95));font:600 27px/1.15 "OJ Inter";color:var(--ink);white-space:nowrap;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.reason i{width:14px;height:14px;border-radius:50%;background:var(--violet);box-shadow:0 0 14px var(--violet);flex:none}
.stage{font:600 25px/1 "OJ Mono";letter-spacing:.06em;text-transform:none;color:var(--muted);white-space:nowrap;text-align:center}
.stage.on{color:var(--ink)}
.tok{padding:18px 30px;border-radius:999px;border:2px solid rgba(162,152,255,.7);background:rgba(21,27,40,.92);font:700 34px/1 "OJ Grotesk";color:var(--ink);white-space:nowrap;box-shadow:0 0 30px rgba(162,152,255,.25)}
.note{padding:14px 24px;border-radius:16px;border:2px solid rgba(162,152,255,.55);background:rgba(29,37,53,.96);font:600 23px/1 "OJ Inter";color:var(--ink);white-space:nowrap}
.pl{font:500 19px/1 "OJ Mono";letter-spacing:.12em;text-transform:uppercase;color:#E4E0FF;white-space:nowrap;text-shadow:0 0 12px rgba(13,17,27,.9)}
#logo{width:920px;height:250px;overflow:visible}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 85% at 50% 50%,transparent 55%,rgba(5,7,12,.55) 100%)}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#ui{position:fixed;left:0;right:0;bottom:0;padding:14px 22px;background:linear-gradient(transparent,rgba(0,0,0,.8));display:flex;gap:14px;align-items:center;color:#b9b4ee;font:600 13px "OJ Inter";opacity:0;transition:opacity .25s;z-index:9}
body:hover #ui{opacity:1}
#ui input{flex:1;accent-color:#A298FF}
#ui button{background:#A298FF;border:0;border-radius:6px;padding:6px 14px;font:700 13px "OJ Inter";color:#12103A;cursor:pointer}
body.render #ui{display:none}
</style>
