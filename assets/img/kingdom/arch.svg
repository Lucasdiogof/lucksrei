<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" fill="none" stroke="#f9d577" stroke-linecap="round" stroke-linejoin="round">
  <!-- "Sala do trono" digital: arcos simétricos, pilares, vitral radial, piso em perspectiva e trilhas de circuito.
       Traço fino; a opacidade final é dada pelo CSS (fica quase invisível, subliminar). -->
  <g stroke-width="1.4">
    <path d="M150 820V372a350 350 0 0 1 700 0v448"/>
    <path d="M232 820V390a268 268 0 0 1 536 0v430" stroke-opacity=".75"/>
    <path d="M318 820V410a182 182 0 0 1 364 0v410" stroke-opacity=".5"/>
  </g>
  <!-- pilares com capitel -->
  <g stroke-width="1.1" stroke-opacity=".7">
    <path d="M150 372v448M172 380v440M828 380v440M850 372v448"/>
    <path d="M140 372h42M818 372h42M140 380h42M818 380h42"/>
    <path d="M140 806h42M818 806h42"/>
  </g>
  <!-- vitral: raios entre o arco externo e o do meio -->
  <g stroke-width="1" stroke-opacity=".45">
    <path d="M500 22v86M402 36l26 82M598 36l-26 82M316 82l50 70M684 82l-50 70M246 152l70 50M754 152l-70 50M196 240l82 26M804 240l-82 26"/>
  </g>
  <!-- ponta de coroa no ápice + diamante -->
  <g stroke-width="1.4">
    <path d="M462 120l12-26 13 16 13-30 13 30 13-16 12 26z"/>
    <path d="M462 126h76" stroke-opacity=".7"/>
    <path d="M500 46l9 12-9 12-9-12z"/>
  </g>
  <!-- trilhas de circuito acompanhando o arco interno, com nós -->
  <g stroke-width="1" stroke-opacity=".6">
    <path d="M232 560h-34l-22-22v-96M768 560h34l22-22v-96"/>
    <path d="M318 520h-40l-18 18v80M682 520h40l18 18v80"/>
    <path d="M286 300l-24-24h-46M714 300l24-24h46"/>
    <path d="M400 196l-16-16v-34M600 196l16-16v-34"/>
  </g>
  <g fill="#f9d577" stroke="none" fill-opacity=".8">
    <circle cx="176" cy="442" r="3"/><circle cx="824" cy="442" r="3"/>
    <circle cx="260" cy="618" r="3"/><circle cx="740" cy="618" r="3"/>
    <circle cx="216" cy="276" r="3"/><circle cx="784" cy="276" r="3"/>
    <circle cx="384" cy="146" r="3"/><circle cx="616" cy="146" r="3"/>
  </g>
  <!-- piso em perspectiva convergindo para o centro -->
  <g stroke-width="1" stroke-opacity=".35">
    <path d="M500 600L-100 820M500 600L120 820M500 600L330 820M500 600L500 820M500 600L670 820M500 600L880 820M500 600L1100 820"/>
    <path d="M60 760h880M160 700h680M260 652h480" stroke-opacity=".6"/>
  </g>
</svg>
