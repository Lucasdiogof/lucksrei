name: Site tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run repository tests
        run: |
          set -e
          for test_file in tests/*.test.js; do
            echo "Running ${test_file}"
            node "$test_file"
          done
